<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640"><rect width="1240" height="640" fill="#fcfcfb"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="bold">To-Be: route-calibrated promise and a managed seller handover</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8984"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker></defs><rect x="24" y="70" width="1192" height="104" rx="6" fill="#f4f3ef" stroke="none" stroke-width="1"/><text x="40" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="bold">Customer</text><rect x="24" y="180" width="1192" height="104" rx="6" fill="#fbfaf7" stroke="none" stroke-width="1"/><text x="40" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="bold">Olist platform</text><rect x="24" y="290" width="1192" height="104" rx="6" fill="#f4f3ef" stroke="none" stroke-width="1"/><text x="40" y="345.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="bold">Seller</text><rect x="24" y="400" width="1192" height="104" rx="6" fill="#fbfaf7" stroke="none" stroke-width="1"/><text x="40" y="455.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52514e" text-anchor="start" font-weight="bold">Carrier</text><rect x="170" y="93.0" width="150" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="245.0" y="117.91666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Places order</text><text x="245.0" y="134.41666666666669" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">sees route promise</text><rect x="370" y="203.0" width="160" height="58" rx="8" fill="#e7f1fb" stroke="#2a78d6" stroke-width="2"/><text x="450.0" y="227.91666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Route table promise</text><text x="450.0" y="244.41666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">FR-01 · 85th pct transit</text><rect x="575" y="203.0" width="150" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="650.0" y="227.91666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Approves payment</text><text x="650.0" y="244.41666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">deadline to seller</text><rect x="565" y="313.0" width="170" height="58" rx="8" fill="#e7f1fb" stroke="#2a78d6" stroke-width="2"/><text x="650.0" y="337.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Hands over</text><text x="650.0" y="354.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">logged vs deadline · FR-04</text><rect x="790" y="423.0" width="170" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="875.0" y="447.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Transports</text><text x="875.0" y="464.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">transit time feeds FR-02</text><rect x="790" y="93.0" width="170" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="875.0" y="117.91666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Receives order</text><text x="875.0" y="134.41666666666669" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">on the route promise</text><rect x="1015" y="93.0" width="185" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="1107.5" y="117.91666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Writes review</text><text x="1107.5" y="134.41666666666669" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">tracked weekly</text><rect x="1015" y="188.0" width="185" height="88" rx="8" fill="#e7f1fb" stroke="#2a78d6" stroke-width="2"/><text x="1107.5" y="212.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Weekly loop</text><text x="1107.5" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">refresh route table → FR-01</text><text x="1107.5" y="244.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">seller tiers A/B/C</text><text x="1107.5" y="260.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">coach B · review C</text><rect x="370" y="423.0" width="160" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3" stroke-dasharray="5 4"/><text x="450.0" y="447.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Phase 2 (parked)</text><text x="450.0" y="464.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">risk score + message</text><path d="M320 122.0 L345 122.0 L345 232.0 L368 232.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M530 232.0 L573 232.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M650 261.0 L650 311.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M735 342.0 L760 342.0 L760 452.0 L788 452.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M875 423.0 L875 153.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M960 122.0 L1013 122.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M1107 151.0 L1107 186.0" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/><text x="24" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold">What changes</text><text x="24" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Blue = new or changed step. Dashed = parked until volume is ~13× today (business case).</text><text x="24" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Promise per route: seller state × customer state × distance band, refreshed weekly (FR-01, FR-02).</text><text x="24" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Handover becomes a KPI: tiers A/B/C, coaching before penalties, seller sees the numbers (FR-04, FR-05).</text><text x="24" y="622" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Every order logs the route-table version and tier used, so the pilot can be measured (FR-07).</text></svg>