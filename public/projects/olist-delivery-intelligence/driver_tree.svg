<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470"><rect width="1100" height="470" fill="#fcfcfb"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="bold">Driver tree: most late orders are a transit and promise problem</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8984"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker></defs><rect x="40" y="190" width="200" height="80" rx="8" fill="#e7f1fb" stroke="#2a78d6" stroke-width="2"/><text x="140.0" y="225.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Late delivery rate</text><text x="140.0" y="243.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal">6.8% · 6,529 orders</text><rect x="320" y="95" width="240" height="74" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="440.0" y="127.83333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Seller handed over late</text><text x="440.0" y="144.83333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">27.7% of late orders</text><rect x="320" y="290" width="240" height="74" rx="8" fill="#e7f1fb" stroke="#2a78d6" stroke-width="2"/><text x="440.0" y="322.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Seller on time, still late</text><text x="440.0" y="339.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">72.3% of late orders</text><rect x="640" y="60" width="410" height="64" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="845.0" y="87.91666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Late handover → late rate 21.1% vs 5.4%</text><text x="845.0" y="104.41666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Lever: seller SLA, tiers A/B/C (Option B)</text><rect x="640" y="140" width="410" height="64" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="845.0" y="167.91666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Seller handling 5.4 days vs 2.5</text><text x="845.0" y="184.41666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">90th-percentile seller: 25% handovers late</text><rect x="640" y="240" width="410" height="64" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="845.0" y="267.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Carrier transit 27.9 days vs 7.9</text><text x="845.0" y="284.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">No carrier ID in data → measure by route</text><rect x="640" y="320" width="410" height="64" rx="8" fill="#e7f1fb" stroke="#2a78d6" stroke-width="2"/><text x="845.0" y="347.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Promise does not fit the route (r = −0.72)</text><text x="845.0" y="364.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Lever: route-calibrated ETA (Option A)</text><rect x="640" y="400" width="410" height="50" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="845.0" y="429.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Peak months: 12.4% Nov 2017 · 19.0% Mar 2018</text><path d="M240 230 L279.0 230 L279.0 132 L318 132" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M240 230 L279.0 230 L279.0 327 L318 327" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M560 132 L599.0 132 L599.0 92 L638 92" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M560 132 L599.0 132 L599.0 172 L638 172" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M560 327 L599.0 327 L599.0 272 L638 272" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M560 327 L599.0 327 L599.0 352 L638 352" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M560 327 L599.0 327 L599.0 425 L638 425" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/></svg>