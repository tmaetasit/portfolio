" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">sees promise ≈ 24 days</text><rect x="370" y="203.0" width="150" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="445.0" y="227.91666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Sets promise</text><text x="445.0" y="244.41666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">one buffer, all routes</text><rect x="560" y="203.0" width="150" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="635.0" y="227.91666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Approves payment</text><text x="635.0" y="244.41666666666666" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">0.5 days</text><rect x="560" y="313.0" width="150" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="635.0" y="337.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Prepares + hands over</text><text x="635.0" y="354.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">2.5 d on time · 5.4 d late</text><rect x="780" y="423.0" width="170" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="865.0" y="447.9166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Transports</text><text x="865.0" y="464.4166666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">7.9 d on time · 27.9 d late</text><rect x="780" y="93.0" width="170" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="865.0" y="117.91666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Receives order</text><text x="865.0" y="134.41666666666669" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">6.8% after the promise</text><rect x="1010" y="93.0" width="190" height="58" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.3"/><text x="1105.0" y="117.91666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Writes review</text><text x="1105.0" y="134.41666666666669" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">4.29 on time · 2.27 late</text><path d="M320 122.0 L345 122.0 L345 232.0 L368 232.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M520 232.0 L558 232.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M635 261.0 L635 311.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M710 342.0 L745 342.0 L745 452.0 L778 452.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M865 423.0 L865 153.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><path d="M950 122.0 L1008 122.0" fill="none" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><circle cx="512" cy="199.0" r="11" fill="#c0392b"/><text x="512" y="203.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="702" cy="309.0" r="11" fill="#c0392b"/><text x="702" y="313.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle cx="942" cy="419.0" r="11" fill="#c0392b"/><text x="942" y="423.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><circle cx="942" cy="89.0" r="11" fill="#c0392b"/><text x="942" y="93.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="24" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold">Pain points (evidence from WS1)</text><text x="24" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">1  Promise ignores the route: state late rate 2.8%–21.5%, tied to ETA buffer (r = −0.72)</text><text x="634" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">2  Handover deadline not managed: a late handover lifts the late rate from 5.4% to 21.1%</text><text x="24" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">3  Transit is where late orders lose time: +19.9 days vs on-time orders; no carrier data</text><text x="634" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">4  Customer is not warned: even 1–3 days late cuts the review from 4.29 to 3.29</text></svg>